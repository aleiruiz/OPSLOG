# Serves the web shell and forwards /api to the API container (same origin, so the session cookie
# and CSRF checks of the BFF apply). TLS is terminated by the Coolify proxy in front of this server.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;
  server_tokens off;

  # Docker's embedded DNS; the API container may start after this one.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Readiness is for the container health check inside the Docker network; it is not published.
  # (Without this the single-page fallback below would answer it with the shell and a 200.)
  location = /readyz {
    return 404;
  }

  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    # The BFF compares the Origin header with the Host it was sent to; keep both as the browser sent them.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
    # Declaring any add_header here stops the server-level set from being added twice: the BFF sends its own.
    add_header X-Content-Type-Options nosniff always;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
  }

  location / {
    # Single-page app: unknown paths fall back to the shell.
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
  }
}
