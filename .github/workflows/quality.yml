name: quality
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0.45
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      OPSLOG_TEST_MYSQL_ADMIN_URL: mysql://root@127.0.0.1:3306/mysql
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      # Offline secret scan of tracked files (SPECS §9.2); no third-party action, no network.
      - run: node tests/harness/leak-scan.mjs
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with: { version: 11.25.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22.13.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm quality
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Storybook static build (offline) + pixel snapshots of every story (SPECS §9.1, ADR-0010).
      - run: pnpm test:visual
