# OPSLOG demo stack for Coolify (Docker Compose build pack) or `docker compose up` locally.
# Staging only, synthetic data. See docs/operations/DEPLOY_COOLIFY.md.
services:
  # One-shot job: with the MySQL root account it creates the database, applies the migrations and
  # creates the restricted accounts the API runs with. Idempotent; it runs on every `up` before the
  # API starts. With OPSLOG_PERSISTENCE=memory it does nothing.
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    restart: 'no'
    command:
      - sh
      - -c
      - 'if [ "$$OPSLOG_PERSISTENCE" = mysql ]; then exec node migrate.mjs; else echo "persistence is memory: nothing to migrate"; fi'
    environment:
      OPSLOG_PERSISTENCE: ${OPSLOG_PERSISTENCE:-mysql}
      OPSLOG_MYSQL_HOST: mysql
      OPSLOG_MYSQL_DATABASE: ${OPSLOG_MYSQL_DATABASE:-opslog_t_main}
      OPSLOG_MYSQL_ROOT_PASSWORD: ${OPSLOG_MYSQL_ROOT_PASSWORD:?root password for the database}
      OPSLOG_MYSQL_SECRET: ${OPSLOG_MYSQL_SECRET:-}
      # Creates the `opslog_backup` account (SELECT and binlog reading only) when set; the `backup`
      # service signs in with the same value.
      OPSLOG_BACKUP_PASSWORD: ${OPSLOG_BACKUP_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      OPSLOG_ENV: staging
      OPSLOG_PUBLIC_ORIGIN: ${OPSLOG_PUBLIC_ORIGIN:?public https origin, e.g. https://opslog.example.com}
      OPSLOG_BFF_SECRET: ${OPSLOG_BFF_SECRET:?at least 32 characters}
      OPSLOG_GRANT_SECRET: ${OPSLOG_GRANT_SECRET:?at least 32 characters}
      # cognito (default here: real sign-in, needs the OPSLOG_OIDC_* values) or synthetic (local only).
      OPSLOG_AUTH_MODE: ${OPSLOG_AUTH_MODE:-cognito}
      OPSLOG_OIDC_ISSUER: ${OPSLOG_OIDC_ISSUER:-}
      OPSLOG_OIDC_DOMAIN: ${OPSLOG_OIDC_DOMAIN:-}
      OPSLOG_OIDC_CLIENT_ID: ${OPSLOG_OIDC_CLIENT_ID:-}
      OPSLOG_OIDC_CLIENT_SECRET: ${OPSLOG_OIDC_CLIENT_SECRET:-}
      OPSLOG_OIDC_REDIRECT_URI: ${OPSLOG_OIDC_REDIRECT_URI:-}
      # Optional first company + its administrator (Cognito sub); set both or neither.
      OPSLOG_BOOTSTRAP_COMPANY: ${OPSLOG_BOOTSTRAP_COMPANY:-}
      OPSLOG_BOOTSTRAP_ADMIN_SUB: ${OPSLOG_BOOTSTRAP_ADMIN_SUB:-}
      # mysql (default) keeps users, sessions and all business data in the database volume across
      # restarts; memory loses everything on restart (throwaway runs only).
      OPSLOG_PERSISTENCE: ${OPSLOG_PERSISTENCE:-mysql}
      OPSLOG_MYSQL_HOST: mysql
      OPSLOG_MYSQL_DATABASE: ${OPSLOG_MYSQL_DATABASE:-opslog_t_main}
      # Root of the per-account MySQL passwords (at least 32 characters). Required with mysql.
      OPSLOG_MYSQL_SECRET: ${OPSLOG_MYSQL_SECRET:-}
      # Base64 of at least 32 random bytes: seals personal data. Losing it makes that data unreadable.
      OPSLOG_PII_MASTER_KEY: ${OPSLOG_PII_MASTER_KEY:-}
      # memory (default) or s3; with s3 the OPSLOG_S3_* values below are required.
      OPSLOG_OBJECT_STORAGE: ${OPSLOG_OBJECT_STORAGE:-memory}
      OPSLOG_S3_BUCKET: ${OPSLOG_S3_BUCKET:-}
      OPSLOG_S3_REGION: ${OPSLOG_S3_REGION:-}
      OPSLOG_S3_ACCESS_KEY_ID: ${OPSLOG_S3_ACCESS_KEY_ID:-}
      OPSLOG_S3_SECRET_ACCESS_KEY: ${OPSLOG_S3_SECRET_ACCESS_KEY:-}
      # Optional SMTP mail: set all five or none (none keeps the log-only sink). TLS is required.
      OPSLOG_SMTP_HOST: ${OPSLOG_SMTP_HOST:-}
      OPSLOG_SMTP_PORT: ${OPSLOG_SMTP_PORT:-}
      OPSLOG_SMTP_USER: ${OPSLOG_SMTP_USER:-}
      OPSLOG_SMTP_PASSWORD: ${OPSLOG_SMTP_PASSWORD:-}
      OPSLOG_SMTP_FROM: ${OPSLOG_SMTP_FROM:-}
    expose:
      - '8080'
    # Readiness (database reachable, migrations applied, worker ticking), not just liveness: an
    # unhealthy `api` raises the Coolify container-health notification. `/healthz` stays the cheap
    # liveness probe of the image.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
      # Public settings of the redirect login (no secret); empty keeps the production web fail-closed.
      args:
        VITE_OIDC_DOMAIN: ${OPSLOG_OIDC_DOMAIN:-}
        VITE_OIDC_CLIENT_ID: ${OPSLOG_OIDC_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # No published port: the Coolify proxy routes the domain to port 80. Locally, add
    # deploy/compose.local.yml to publish it on http://localhost:8081.
    expose:
      - '80'

  # Public sales page with the demo-request form (docs/operations/LANDING.md). Independent of the
  # app: give it its own domain in Coolify. Requests are kept in the landing-data volume.
  landing:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: landing
    restart: unless-stopped
    environment:
      # Password of user `admin` for /admin/leads (at least 16 characters); empty hides the list.
      LANDING_ADMIN_PASSWORD: ${LANDING_ADMIN_PASSWORD:-}
      # Optional https webhook (Slack, Discord, n8n...) told about every new request.
      LANDING_NOTIFY_URL: ${LANDING_NOTIFY_URL:-}
      # Address shown on the privacy notice for data requests.
      LANDING_CONTACT_EMAIL: ${LANDING_CONTACT_EMAIL:-}
    volumes:
      - landing-data:/data
    expose:
      - '8090'

  # Holds every record of the API when OPSLOG_PERSISTENCE=mysql. No published port; data lives in
  # the mysql-data volume; `backup` copies it to opslog-backups (keep OPSLOG_PII_MASTER_KEY elsewhere).
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # The binary log is what lets the backup restore to a point in time: the `backup` service copies
    # the closed logs every 15 minutes, so seven days of local logs is generous.
    command:
      - '--innodb-buffer-pool-size=128M'
      - '--performance-schema=OFF'
      - '--server-id=1'
      - '--log-bin=binlog'
      - '--binlog-expire-logs-seconds=604800'
    environment:
      MYSQL_ROOT_PASSWORD: ${OPSLOG_MYSQL_ROOT_PASSWORD:?root password for the database}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Daily mysqldump plus the closed binary logs every 15 minutes into the `opslog-backups` volume,
  # 35 days of retention, SHA-256 per file. Same network as `mysql`, no published port. Restore:
  # infra/operations/README.md. The volume lives on the same VPS as the database: copying it off the
  # host is an owner decision that is not made here (docs/tasks/MVP-OPS-M5-20261019.md).
  backup:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      OPSLOG_BACKUP_HOST: mysql
      OPSLOG_BACKUP_PASSWORD: ${OPSLOG_BACKUP_PASSWORD:-}
      OPSLOG_BACKUP_RETENTION_DAYS: ${OPSLOG_BACKUP_RETENTION_DAYS:-35}
    volumes:
      - opslog-backups:/backups

volumes:
  mysql-data:
  landing-data:
  opslog-backups:
